  - sensor:
      - name: "Müllabfuhr"
        state: "{{ states('sensor.fes_abfuhrtermine_fes_anstehend') }}"
        attributes:
          status: >
            {% set weekdays = [
              "Montag", "Dienstag", "Mittwoch", "Donnerstag",
              "Freitag", "Samstag", "Sonntag"
            ] %}
            {% set days = state_attr('sensor.fes_abfuhrtermine_fes_anstehend', 'daysTo') | int(0) %}
            {% set now = now() %}
            {% if days == 0 %}
              {% if now.hour >= 4 %}
                Heute
              {% else %}
                Morgen ({{ weekdays[now.weekday()] }})
              {% endif %}
            {% elif days == 1 %}
              {% if now.hour >= 4 %}
                Morgen
              {% else %}
                Morgen ({{ weekdays[now.weekday()] }})
              {% endif %}
            {% else %}
              none
            {% endif %}
          icon: >
            {% set icon_map = {
              "Restmüll": "mdi:trash-can",
              "Biomüll": "mdi:leaf",
              "Altpapier": "mdi:file-document-outline",
              "Gelber Sack": "mdi:recycle",
            } %}
            {{ icon_map.get(states('sensor.fes_abfuhrtermine_fes_anstehend'), "mdi:trash-can-outline") }}
